<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-label="Album cover placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#082f49"/>
      <stop offset="55%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#155e75"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <rect width="800" height="800" fill="url(#glow)"/>
  <rect x="36" y="36" width="728" height="728" fill="none" stroke="#a5f3fc" stroke-opacity="0.45" stroke-width="4"/>
  <text x="400" y="370" text-anchor="middle" fill="#ecfeff" font-family="Segoe UI, Helvetica, sans-serif" font-size="64" font-weight="700" letter-spacing="4">VJ LAB</text>
  <text x="400" y="430" text-anchor="middle" fill="#cffafe" font-family="Segoe UI, Helvetica, sans-serif" font-size="28" letter-spacing="6">COVER ART</text>
</svg>
